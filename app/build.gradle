plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.tvflux.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvflux.pro'
        minSdk 21
        targetSdk 35
        multiDexEnabled true
        versionCode 2904
        versionName '29.4.0-BLACKSCREEN-FIX'
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental"   : "true"
                ]
            }
        }
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        release {
            def ksFile = rootProject.file("keystore/livepro-release.jks")
            def storePassEnv = System.getenv("LIVEPRO_STORE_PASS")
            def keyPassEnv = System.getenv("LIVEPRO_KEY_PASS")
            def keyAliasEnv = System.getenv("LIVEPRO_KEY_ALIAS") ?: "livepro_key"
            storeFile ksFile
            storePassword storePassEnv ?: ""
            keyAlias keyAliasEnv
            keyPassword keyPassEnv ?: ""
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Release builds must use the original release identity; fail closed if absent.
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
            "-opt-in=androidx.compose.ui.ExperimentalComposeUiApi",
            "-opt-in=androidx.compose.animation.ExperimentalAnimationApi",
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
            "-XXLanguage:+BreakContinueInInlineLambdas",
            "-P", "plugin:androidx.compose.compiler.plugins.kotlin:strongSkipping=true",
            "-P", "plugin:androidx.compose.compiler.plugins.kotlin:experimentalStrongSkipping=true",
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'UnsafeOptInUsageError', 'MissingTvBanner', 'ObsoleteSdkInt', 'CustomX509TrustManager', 'TrustAllX509TrustManager'
        abortOnError false
        checkReleaseBuilds false
        textReport true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/*.so']
        }
    }
}

kapt {
    correctErrorTypes = true
    useBuildCache = true
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'

    // Room 2.6.1 (Single Source of Truth + WAL + Flow)
    def room_version = '2.6.1'
    implementation "androidx.room:room-runtime:${room_version}"
    implementation "androidx.room:room-ktx:${room_version}"
    implementation "androidx.room:room-paging:${room_version}"
    kapt "androidx.room:room-compiler:${room_version}"

    // Gson 2.10.1 (Streaming JsonReader)
    implementation 'com.google.code.gson:gson:2.10.1'

    // WorkManager 2.9.0 (Background Periodic Sync)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Paging 3.3.0
    implementation 'androidx.paging:paging-runtime-ktx:3.3.0'
    implementation 'androidx.paging:paging-compose:3.3.0'

    // Official WireGuard Tunnel Library (GoBackend + libwg-go.so)
    implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // Media3 ExoPlayer Full Production Suite + Native FFmpeg All-Codec Decoder (HLS / M3U8 / TS / DASH MPD / RTSP / RTMP / SmoothStreaming / MKV / MP4 / AVI / FLV)
    def media3_version = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-dash:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-rtsp:${media3_version}"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:${media3_version}"
    implementation "androidx.media3:media3-datasource-rtmp:${media3_version}"
    implementation "androidx.media3:media3-extractor:${media3_version}"
    implementation "androidx.media3:media3-ui:${media3_version}"
    implementation "androidx.media3:media3-datasource-okhttp:${media3_version}"
    implementation "androidx.media3:media3-common:${media3_version}"
    implementation "androidx.media3:media3-decoder:${media3_version}"

    // Embedded FFmpeg 6.0 Media3 Decoder Extension (AC-3, E-AC-3, Dolby Atmos, DTS, DTS-HD, TrueHD, MP2, MP3, AAC, Vorbis, Opus, FLAC, ALAC, PCM)
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2'

    // High-performance Networking & Concurrency
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
